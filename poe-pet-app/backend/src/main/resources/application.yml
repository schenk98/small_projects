spring:
  application:
    name: backend
  security:
    user:
      # Setting an explicit user removes the noisy "generated password" dev warning.
      # This app currently permits all requests anyway (see SecurityConfig), so this is only to keep logs clean.
      name: ${SPRING_SECURITY_USER_NAME:dev}
      password: ${SPRING_SECURITY_USER_PASSWORD:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017/poe_pet?authSource=admin}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  webBaseUrl: ${WEB_BASE_URL:http://localhost:5173}
  apiBaseUrl: ${API_BASE_URL:http://localhost:8080}
  # Comma-separated origins allowed for browser CORS requests.
  # Keep this tight (dev default is Vite). Example: APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,https://your-domain.com
  corsAllowedOrigins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  accessTokenHours: 4
  refreshTokenDays: 14
  # Comma-separated emails that may use /api/dev tools and in-app developer dropdown (in addition to UserAccount.privileged).
  # Local example: APP_PRIVILEGED_EMAILS=you@example.com
  privilegedEmails: ${APP_PRIVILEGED_EMAILS:}

  # Optional sidecar AI gateway (Local SLM Gateway) configuration.
  # This is dev-oriented and may be overridden at runtime via privileged /api/dev/ai/config.
  aiGatewayBaseUrl: ${APP_AI_GATEWAY_BASE_URL:}
  aiGatewayApiKey: ${APP_AI_GATEWAY_API_KEY:}

server:
  port: 8080
