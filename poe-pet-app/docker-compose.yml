services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: poe-pet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Local dev: 5173. On EC2 with SG "HTTP 80", set FRONTEND_HOST_PORT=80 in .env.aws
      - "${FRONTEND_HOST_PORT:-5173}:80"

  backend:
    build:
      context: ./backend
    container_name: poe-pet-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - postgres
      - notification-soap-service
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/poe_pet?authSource=admin}
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-jdbc:postgresql://postgres:5432/poe_pet}
      SQL_DATABASE_USERNAME: ${SQL_DATABASE_USERNAME:-poe_pet}
      SQL_DATABASE_PASSWORD: ${SQL_DATABASE_PASSWORD:-poe_pet}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_AI_GATEWAY_BASE_URL: ${APP_AI_GATEWAY_BASE_URL:-}
      APP_AI_GATEWAY_API_KEY: ${APP_AI_GATEWAY_API_KEY:-}
      APP_AI_GATEWAY_CONNECT_TIMEOUT_SECONDS: ${APP_AI_GATEWAY_CONNECT_TIMEOUT_SECONDS:-10}
      APP_AI_GATEWAY_CHAT_TIMEOUT_SECONDS: ${APP_AI_GATEWAY_CHAT_TIMEOUT_SECONDS:-300}
      APP_NOTIFICATIONS_ENABLED: ${APP_NOTIFICATIONS_ENABLED:-true}
      APP_NOTIFICATION_SOAP_ENABLED: ${APP_NOTIFICATION_SOAP_ENABLED:-true}
      APP_NOTIFICATION_SOAP_URL: ${APP_NOTIFICATION_SOAP_URL:-http://notification-soap-service:8081/ws}
      APP_NOTIFICATION_LOW_HUNGER_THRESHOLD: ${APP_NOTIFICATION_LOW_HUNGER_THRESHOLD:-15}
      APP_SKIP_EMAIL_VERIFICATION: ${APP_SKIP_EMAIL_VERIFICATION:-false}
    ports:
      # Host port only (inside the stack, nginx still uses backend:8080). Override if 8080 is busy.
      - "${BACKEND_HOST_PORT:-8080}:8080"

  mongodb:
    image: mongo:7
    container_name: poe-pet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: poe_pet
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - ./mongodb/scripts:/scripts:ro
      - ./mongodb/seed-shop-items.json:/seed/seed-shop-items.json:ro
      - ./mongodb/seed-minigames.json:/seed/seed-minigames.json:ro

  postgres:
    image: postgres:16
    container_name: poe-pet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poe_pet}
      POSTGRES_USER: ${POSTGRES_USER:-poe_pet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poe_pet}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: poe-pet-mailhog
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"

  notification-soap-service:
    build:
      context: ./notification-soap-service
    container_name: poe-pet-notification-soap
    restart: unless-stopped
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_FROM_ADDRESS: ${NOTIFICATION_FROM_ADDRESS:-no-reply@poe-pet.local}
    ports:
      - "8081:8081"

volumes:
  mongo_data:
  postgres_data:
