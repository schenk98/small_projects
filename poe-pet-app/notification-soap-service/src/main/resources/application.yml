spring:
  application:
    name: notification-soap-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

notification:
  fromAddress: ${NOTIFICATION_FROM_ADDRESS:no-reply@poe-pet.local}

server:
  port: 8081
