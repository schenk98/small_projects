<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editace záznamu</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f8fafc; color:#0f172a; }
        .shell { max-width:1200px; margin:28px auto; padding:0 18px 40px; }
        .topbar { background:#0f172a; color:white; border-radius:22px; padding:18px 22px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .user-box { display:flex; align-items:center; gap:12px; }
        .avatar { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#7dd3fc,#2563eb); display:flex; align-items:center; justify-content:center; font-weight:700; }
        .role-tag { display:inline-block; background:rgba(125,211,252,.18); border:1px solid rgba(125,211,252,.35); border-radius:999px; padding:4px 8px; font-size: .7rem; font-weight:700; text-transform: uppercase; }
        .mini-stats { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
        .mini-stat { background:rgba(255,255,255,0.08); border-radius:999px; padding:7px 12px; }
        .logout { color:white; text-decoration:none; font-weight:700; }
        .nav { margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; }
        .nav a { text-decoration:none; color:#0f172a; background:white; border:1px solid #dfe7f5; border-radius:10px; padding:9px 14px; font-weight:600; }
        .nav a.active { background:#0f172a; color:white; }
        .panel { margin-top:22px; background:white; border-radius:18px; padding:22px; box-shadow:0 12px 28px rgba(15,23,42,0.06); }
        .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
        .field label { font-weight:600; }
        input, textarea { border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; font:inherit; }
        textarea { min-height:100px; }
        .button-row { display:flex; gap:12px; margin-top:18px; }
        .primary-btn, .secondary-btn { display:inline-block; border-radius:10px; padding:10px 16px; font-weight:700; text-decoration:none; border:none; cursor:pointer; }
        .primary-btn { background:#0f172a; color:white; }
        .secondary-btn { background:#e2e8f0; color:#0f172a; }
        .muted { color:#475569; }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="user-box">
            <div class="avatar" th:text="${avatarText}">U</div>
            <div>
                <div class="role-tag" th:text="${role}">TEACHER</div>
                <div th:text="${userEmail}">teacher@email.com</div>
            </div>
        </div>
        <div class="mini-stats">
            <div class="mini-stat" th:text="|Peněženka: ${walletBalance} bodů|">Peněženka: 0 bodů</div>
            <a class="logout" th:href="@{/logout}">Odhlásit</a>
        </div>
    </header>

    <nav class="nav" aria-label="Hlavní navigace">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/history}" class="active">Historie</a>
        <a th:href="@{/users}">Uživatelé</a>
    </nav>

    <div class="panel">
        <h2>Editace záznamu</h2>

        <form th:action="@{/history/update}" method="post">
            <input type="hidden" name="type" th:value="${eventType}" />
            <input type="hidden" th:if="${eventType == 'SESSION'}" name="id" th:value="${sessionId}" />
            <input type="hidden" th:if="${eventType == 'ADJUSTMENT'}" name="id" th:value="${adjustmentId}" />
            <input type="hidden" th:if="${targetUserId}" name="studentId" th:value="${targetUserId}" />

            <!-- Session edit -->
            <div th:if="${eventType == 'SESSION'}">
                <div class="field">
                    <label>Kniha</label>
                    <input type="text" th:value="${bookTitle}" disabled style="background:#f0f0f0;" />
                </div>
                <div class="field">
                    <label for="minutes">Minuty</label>
                    <input id="minutes" name="minutes" type="number" min="0" th:value="${minutes}" required />
                </div>
                <div class="field">
                    <label for="pagesFrom">Strany od</label>
                    <input id="pagesFrom" name="pagesFrom" type="number" min="0" th:value="${pagesFrom}" required />
                </div>
                <div class="field">
                    <label for="pagesTo">Strany do</label>
                    <input id="pagesTo" name="pagesTo" type="number" min="0" th:value="${pagesTo}" required />
                </div>
                <div class="field">
                    <label for="note">Poznámka</label>
                    <textarea id="note" name="note" th:text="${note}"></textarea>
                </div>
                <div class="field">
                    <label>Body (read-only)</label>
                    <input type="text" th:value="${points}" disabled style="background:#f0f0f0;" />
                </div>
            </div>

            <!-- Adjustment edit -->
            <div th:if="${eventType == 'ADJUSTMENT'}">
                <div class="field">
                    <label for="amount">Množství bodů</label>
                    <input id="amount" name="amount" type="number" step="0.01" th:value="${amount}" required />
                </div>
                <div class="field">
                    <label for="reason">Důvod</label>
                    <input id="reason" name="reason" type="text" th:value="${reason}" required />
                </div>
            </div>

            <div class="button-row">
                <button class="primary-btn" type="submit">Uložit změny</button>
                <a class="secondary-btn" th:href="@{/history(studentId=${targetUserId})}">Zrušit</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
