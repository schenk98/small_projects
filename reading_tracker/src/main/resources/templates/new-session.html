<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nový záznam</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f8fafc; color:#0f172a; }
        .shell { max-width:1200px; margin:28px auto; padding:0 18px 40px; }
        .topbar { background:#0f172a; color:white; border-radius:22px; padding:18px 22px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .user-box { display:flex; align-items:center; gap:12px; }
        .avatar { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#7dd3fc,#2563eb); display:flex; align-items:center; justify-content:center; font-weight:700; }
        .role-tag { display:inline-block; background:rgba(125,211,252,.18); border:1px solid rgba(125,211,252,.35); border-radius:999px; padding:4px 8px; font-size: .7rem; font-weight:700; text-transform: uppercase; }
        .mini-stats { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
        .mini-stat { background:rgba(255,255,255,0.08); border-radius:999px; padding:7px 12px; }
        .logout { color:white; text-decoration:none; font-weight:700; }
        .nav { margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; }
        .nav a { text-decoration:none; color:#0f172a; background:white; border:1px solid #dfe7f5; border-radius:10px; padding:9px 14px; font-weight:600; }
        .nav a.active { background:#0f172a; color:white; }
        .panel { margin-top:22px; background:white; border-radius:18px; padding:22px; box-shadow:0 12px 28px rgba(15,23,42,0.06); }
        .two-col { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:22px; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field label { font-weight:600; }
        input, select, textarea { border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; font:inherit; }
        textarea { width:100%; box-sizing:border-box; min-height:140px; }
        .button-row { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
        .primary-btn, .secondary-btn { display:inline-block; border-radius:10px; padding:10px 16px; font-weight:700; text-decoration:none; }
        .primary-btn { background:#0f172a; color:white; }
        .secondary-btn { background:#e2e8f0; color:#0f172a; }
        .muted { color:#475569; }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="user-box">
            <div class="avatar" th:text="${avatarText}">U</div>
            <div>
                <div class="role-tag" th:text="${role}">STUDENT</div>
                <div th:text="${userEmail}">user@email.com</div>
            </div>
        </div>
        <div class="mini-stats">
            <div class="mini-stat" th:text="|Peněženka: ${walletBalance} bodů|">Peněženka: 0 bodů</div>
            <div class="mini-stat" th:text="|Knihy: ${booksCount}|">Knihy: 0</div>
            <div class="mini-stat" th:text="|Záznamy: ${recordsCount}|">Záznamy: 0</div>
            <a class="logout" th:href="@{/logout}">Odhlásit</a>
        </div>
    </header>

    <nav class="nav" aria-label="Hlavní navigace">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/new-session}" class="active">Nový záznam</a>
        <a th:href="@{/books}">Knihy</a>
        <a th:href="@{/history}">Historie</a>
        <a th:href="@{/shop}">Obchod</a>
        <a th:if="${isTeacher}" th:href="@{/users}">Uživatelé</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-shop}">Nastavení obchodu</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-questions}">Otázky & bodování</a>
    </nav>

    <div class="panel">
        <h2>Nový záznam čtení</h2>
        <div class="two-col">
            <form th:action="@{/new-session}" method="post" th:object="${sessionForm}">
                <div class="field" style="margin-bottom: 16px;">
                    <label for="bookId">Kniha</label>
                    <select id="bookId" th:field="*{bookId}">
                        <option value="">Vyberte knihu</option>
                        <option th:each="book : ${books}" th:value="${book.id}" th:text="${book.title + ' — ' + book.author}">Kniha</option>
                    </select>
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="date">Datum</label>
                    <input id="date" name="date" type="date" th:value="${selectedDate}" required />
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="minutes">Minuty</label>
                    <input id="minutes" name="minutes" type="number" min="1" value="30" required />
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="pagesFrom">Strany od</label>
                    <input id="pagesFrom" name="pagesFrom" type="number" min="0" value="1" required />
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="pagesTo">Strany do</label>
                    <input id="pagesTo" name="pagesTo" type="number" min="1" value="20" required />
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="note">Poznámka</label>
                    <textarea id="note" name="note" placeholder="Co jste četli?"></textarea>
                </div>

                <div class="field" style="margin-bottom:16px;">
                    <label for="markedFinished">Hotovo</label>
                    <input id="markedFinished" type="checkbox" name="markedFinished" value="true" />
                </div>

                <div class="button-row">
                    <button class="primary-btn" type="submit">Uložit záznam</button>
                    <a class="secondary-btn" th:href="@{/dashboard}">Zrušit</a>
                </div>
            </form>

            <form th:action="@{/books/quick-create}" method="post" th:object="${newBookForm}">
                <h3>Založit novou knihu</h3>
                <div class="field" style="margin-bottom:16px;">
                    <label for="newBookTitle">Název knihy</label>
                    <input id="newBookTitle" name="title" type="text" placeholder="Např. Krásná a zvíře" required />
                </div>
                <div class="field" style="margin-bottom:16px;">
                    <label for="newBookAuthor">Autor</label>
                    <input id="newBookAuthor" name="author" type="text" placeholder="Autor" />
                </div>
                <div class="field" style="margin-bottom:16px;">
                    <label for="newBookPages">Počet stran</label>
                    <input id="newBookPages" name="totalPages" type="number" min="1" value="100" />
                </div>
                <button class="primary-btn" type="submit">Přidat knihu</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
