<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .shell {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 18px 40px;
        }
        .topbar {
            background: #0f172a;
            color: white;
            border-radius: 22px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        }
        .user-box { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #2563eb); display:flex; align-items:center; justify-content:center; font-weight:700; }
        .role-tag { display:inline-block; background: rgba(125,211,252,.18); border:1px solid rgba(125,211,252,.35); color:#dbeafe; border-radius:999px; padding:4px 8px; font-size: .7rem; font-weight:700; text-transform: uppercase; }
        .header-info { display:flex; flex-direction:column; }
        .header-user { font-size: 1.05rem; font-weight:700; }
        .mini-stats { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
        .mini-stat { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 7px 12px; font-size: 0.84rem; }
        .logout-link { color: white; text-decoration: none; font-weight: 700; }
        .nav {
            margin-top: 18px;
            display:flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav a {
            text-decoration:none;
            color: #0f172a;
            background: white;
            border: 1px solid #dfe7f5;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight:600;
        }
        .nav a.active {
            background: #0f172a;
            color: white;
        }
        .featured {
            margin-top: 22px;
            background: linear-gradient(135deg, #dbeafe, #f5f3ff);
            border-radius: 20px;
            padding: 28px 24px;
            border: 1px solid rgba(96,165,250,0.25);
        }
        .featured h1 { margin: 0 0 10px; font-size: clamp(1.7rem, 3vw, 2.5rem); }
        .featured p { margin:0; color:#1f2937; line-height:1.7; }
        .featured-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top: 18px; }
        .primary-btn, .secondary-btn {
            display:inline-block; padding:11px 16px; border-radius:10px; text-decoration:none; font-weight:700;
        }
        .primary-btn { background:#0f172a; color:white; }
        .secondary-btn { background:white; color:#0f172a; border:1px solid rgba(15,23,42,0.08); }
        @media (max-width: 760px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .mini-stats { width:100%; }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="user-box">
            <div class="avatar" th:text="${avatarText}">U</div>
            <div class="header-info">
                <span class="role-tag" th:text="${role}">STUDENT</span>
                <span class="header-user" th:text="${userEmail}">user@example.com</span>
            </div>
        </div>
        <div class="mini-stats">
            <div class="mini-stat" th:text="|Peněženka: ${walletBalance} bodů|">Peněženka: 0 bodů</div>
            <div class="mini-stat" th:text="|Knihy: ${booksCount}|">Knihy: 0</div>
            <div class="mini-stat" th:text="|Záznamy: ${recordsCount}|">Záznamy: 0</div>
            <a class="logout-link" th:href="@{/logout}">Odhlásit</a>
        </div>
    </header>

    <nav class="nav" aria-label="Hlavní navigace">
        <a th:href="@{/dashboard}" class="active">Dashboard</a>
        <a th:href="@{/new-session}">Nový záznam</a>
        <a th:href="@{/books}">Knihy</a>
        <a th:href="@{/history}">Historie</a>
        <a th:href="@{/shop}">Obchod</a>
        <a th:if="${isTeacher}" th:href="@{/users}">Uživatelé</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-shop}">Nastavení obchodu</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-questions}">Otázky & bodování</a>
    </nav>

    <section class="featured">
        <div class="role-tag" style="margin-bottom:12px;">Featured</div>
        <h1 th:text="${featuredTitle}">Vítejte v Čtenářském pasu</h1>
        <p th:text="${featuredText}">Sledujte čtení...</p>
        <div class="featured-actions">
            <a class="primary-btn" th:href="@{/new-session}">Přidat záznam</a>
            <a class="secondary-btn" th:href="@{/books}">Spravovat knihy</a>
        </div>
    </section>
</div>
</body>
</html>
