<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Obchod</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f8fafc; color:#0f172a; }
        .shell { max-width:1200px; margin:28px auto; padding:0 18px 40px; }
        .topbar { background:#0f172a; color:white; border-radius:22px; padding:18px 22px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .user-box { display:flex; align-items:center; gap:12px; }
        .avatar { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#7dd3fc,#2563eb); display:flex; align-items:center; justify-content:center; font-weight:700; }
        .role-tag { display:inline-block; background:rgba(125,211,252,.18); border:1px solid rgba(125,211,252,.35); border-radius:999px; padding:4px 8px; font-size:.7rem; font-weight:700; text-transform: uppercase; }
        .mini-stats { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
        .mini-stat { background:rgba(255,255,255,0.08); border-radius:999px; padding:7px 12px; }
        .logout { color:white; text-decoration:none; font-weight:700; }
        .nav { margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; }
        .nav a { text-decoration:none; color:#0f172a; background:white; border:1px solid #dfe7f5; border-radius:10px; padding:9px 14px; font-weight:600; }
        .nav a.active { background:#0f172a; color:white; }
        .panel { margin-top:22px; background:white; border-radius:18px; padding:22px; box-shadow:0 12px 28px rgba(15,23,42,0.06); }
        .items { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
        .item { border:1px solid #e2e8f0; border-radius:12px; padding:18px; }
        .price { font-weight:800; font-size:1.5rem; }
        .buy-btn { display:inline-block; margin-top:12px; background:#0f172a; color:white; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:700; }
        .muted { color:#475569; }
        .alert { margin-bottom: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="user-box">
            <div class="avatar" th:text="${avatarText}">U</div>
            <div>
                <div class="role-tag" th:text="${role}">STUDENT</div>
                <div th:text="${userEmail}">user@email.com</div>
            </div>
        </div>
        <div class="mini-stats">
            <div class="mini-stat" th:text="|Peněženka: ${walletBalance} bodů|">Peněženka: 0 bodů</div>
            <div class="mini-stat" th:text="|Knihy: ${booksCount}|">Knihy: 0</div>
            <div class="mini-stat" th:text="|Záznamy: ${recordsCount}|">Záznamy: 0</div>
            <a class="logout" th:href="@{/logout}">Odhlásit</a>
        </div>
    </header>

    <nav class="nav" aria-label="Hlavní navigace">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/new-session}">Nový záznam</a>
        <a th:href="@{/books}">Knihy</a>
        <a th:href="@{/history}">Historie</a>
        <a th:href="@{/shop}" class="active">Obchod</a>
        <a th:if="${isTeacher}" th:href="@{/users}">Uživatelé</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-shop}">Nastavení obchodu</a>
        <a th:if="${isTeacher}" th:href="@{/teacher-questions}">Otázky & bodování</a>
    </nav>

    <div class="panel">
        <h2>Obchod</h2>
        <div class="items">
            <div class="item" th:each="item : ${shopItems}">
                <div class="muted">Výhoda</div>
                <h3 th:text="${item.name}">Výhoda</h3>
                <div class="muted" th:text="${item.description}">Popis</div>
                <div class="price" th:text="|${item.pricePoints} bodů|">0 bodů</div>
                <form th:action="@{'/shop/buy/' + ${item.id}}" method="post">
                    <button class="buy-btn" type="submit">Koupit</button>
                </form>
            </div>
        </div>
        <div th:if="${shopSuccess != null}" class="alert alert-success" th:text="${shopSuccess}">Nákup úspěšně proveden.</div>
        <div th:if="${shopError != null}" class="alert alert-error" th:text="${shopError}">Nedostatek bodů.</div>
    </div>
</div>
</body>
</html>
