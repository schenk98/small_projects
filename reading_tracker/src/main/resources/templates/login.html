<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Přihlášení</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            width: min(440px, 90vw);
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }
        h1 { margin-top: 0; }
        .alert { background: #dcfce7; color: #166534; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
        .error { background: #fee2e2; color: #991b1b; }
        form { display: flex; flex-direction: column; gap: 14px; }
        label { font-weight: 600; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .link { margin-top: 14px; text-align: center; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Přihlášení</h1>

    <div th:if="${param.registered != null}" class="alert">Registrace proběhla úspěšně. Nyní se přihlašte.</div>
    <div th:if="${param.error != null}" class="alert error">Neplatný e-mail nebo heslo.</div>
    <div th:if="${param.logout != null}" class="alert">Byli jste odhlášeni.</div>

    <div class="alert" style="background: #eff6ff; color: #1d4ed8;">
        Demo účty:<br/>
        Učitel: <strong>teacher@readingtracker.local</strong> / <strong>Teacher123!</strong><br/>
        Student: <strong>student@readingtracker.local</strong> / <strong>Student123!</strong>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div>
            <label for="password">Heslo</label>
            <input id="password" name="password" type="password" required />
        </div>
        <button type="submit">Přihlásit se</button>
    </form>

    <div class="link">
        <a th:href="@{/register}">Vytvořit účet</a>
    </div>
</div>
</body>
</html>
