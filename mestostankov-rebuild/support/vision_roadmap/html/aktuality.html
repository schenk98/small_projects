<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #5f7486;
}

/* ===== TOP LIŠTA ===== */
.topbar {
    background: #5f7486;
    color: white;
    padding: 10px;
    display: flex;
    align-items: center;
}

.topbar-left,
.topbar-right {
    flex: 1;
}

.topbar-center {
    flex: 2;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.topbar a {
    color: white;
    text-decoration: none;
}

.topbar-center a:not(:last-child)::after {
    content: " |";
    margin-left: 10px;
    color: #ccc;
}

/* ===== HLAVNÍ LAYOUT ===== */
.content {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 15px;
    padding: 15px;
    align-items: start;
}

/* ===== BOČNÍ OBRÁZKY ===== */
.side {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.side-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background-size: cover;
    background-position: center;
}

.left-img {
    background-image: url("obrazek1a.jpg");
}

.right-img {
    background-image: url("obrazek2.jpg");
}

/* ===== STŘED ===== */
.center {
    background: white;
    padding: 15px;
}

/* NADPISY */
.section-title {
    color: #003366;   /* modrá jako Zpět */
    margin: 0 0 10px 0;
}

/* BOXY */
.text-box {
    background: #f5f5f5;
    border: 1px solid #003366;
    padding: 15px;
    margin-bottom: 15px;
}

/* ===== ZPĚT ===== */
.back-btn {
    display: block;
    width: 200px;
    padding: 10px;
    text-align: center;
    border: 1px solid #003366;
    text-decoration: none;
    color: #003366;
    background: white;
    font-weight: bold;
}

/* ===== SPODNÍ LIŠTA ===== */
.services {
    background: white;
    padding: 10px;
    display: flex;
    justify-content: center;
}

.services a {
    color: #5f7486;
    text-decoration: none;
    padding: 0 10px;
}

.services a:not(:last-child)::after {
    content: "|";
    margin-left: 10px;
    color: #aaa;
}

/* CHATBOT TUČNĚ + POSUN */
.services a.chatbot {
    font-weight: bold;
    position: relative;
    top: -2px;
}

/* ===== FOOTER ===== */
.footer {
    background: #003366;
    color: white;
    text-align: center;
    padding: 15px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
    .content {
        grid-template-columns: 1fr;
    }

    .side {
        flex-direction: row;
    }

    .side-img {
        aspect-ratio: 16 / 9;
    }
}
</style>
</head>
