services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-arena-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/the_arena?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: arena_user
      SPRING_DATASOURCE_PASSWORD: arena_password
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/the_arena
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: the-arena-mysql
    environment:
      MYSQL_DATABASE: the_arena
      MYSQL_USER: arena_user
      MYSQL_PASSWORD: arena_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: the-arena-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mongo_data:
