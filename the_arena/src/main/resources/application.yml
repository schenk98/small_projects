spring:
  application:
    name: the-arena
  datasource:
    url: jdbc:h2:mem:arena;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/the_arena

server:
  port: 8080

security:
  jwt:
    secret: the-arena-dev-secret-key-please-change-1234567890
    expirationSeconds: 86400
