<!DOCTYPE html>
<html>
<head>
    <title>Pexeso Game</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .card {
            width: 200px;
            height: 200px;
            margin: 10px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: lightgray;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }
        .card-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .flipped .card-content {
            background-color: white;
        }

        .matched .card-content {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pexeso Game</h1>
        <div id="pexeso-board">
            {% for card in cards %}
                <div class="card" data-word="{{ card.word }}" data-translation="{{ card.translation }}" onclick="flipCard(this)">
                    <div class="card-content"><p></p></div>
                </div>
            {% endfor %}
        </div>
    </div>
    <script>
        let flippedCards = [];
        let lockBoard = false;
        let matchedPairs = 0;

        function flipCard(card) {
            if (lockBoard) return;
            if (flippedCards.includes(card)) return;

            card.classList.add('flipped');
            card.querySelector('.card-content p').innerText = card.getAttribute('data-word');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.getAttribute('data-translation') === card2.getAttribute('data-word');

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedPairs++;
                if (matchedPairs === 8) {
                    setTimeout(() => {
                        alert('You won! The game will restart.');
                        location.reload();
                    }, 1000);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.querySelector('.card-content p').innerText = '';
                    card2.querySelector('.card-content p').innerText = '';
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }
    </script>
</body>
</html>
